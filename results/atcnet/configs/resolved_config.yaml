  - 29
  - 34
split:
  method: run_holdout
  fallback: stratified
  fallback_ratios:
  - 0.7
  - 0.15
  - 0.15
  random_seed: 42
  min_trials_per_split: 2
class_balance:
  use_weights_default: false
  imbalance_threshold: 0.1
device: auto
model:
  name: atcnet
  source: braindecode
  allow_local_fallback: false
  params:
    n_windows: 5
    conv_block_n_filters: 16
    conv_block_pool_size_2: 7
    conv_block_dropout: 0.3
    head_dim: 8
    num_heads: 2
    att_drop_prob: 0.5
    tcn_depth: 2
    tcn_kernel_size: 4
    tcn_drop_prob: 0.3
  input:
    input_window_seconds: 2.0
    sfreq: 256
training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 250
  patience: 30
  monitor: val_balanced_accuracy
  monitor_mode: max
  grad_clip: null
  mixed_precision: false
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 10
    min_lr: 1.0e-05
candidates:
- id: c0
  lr: 0.001
  tcn_kernel_size: 4
- id: c1
