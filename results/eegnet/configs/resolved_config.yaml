  - 29
  - 34
split:
  method: run_holdout
  fallback: stratified
  fallback_ratios:
  - 0.7
  - 0.15
  - 0.15
  random_seed: 42
  min_trials_per_split: 2
class_balance:
  use_weights_default: false
  imbalance_threshold: 0.1
device: auto
model:
  name: eegnet
  source: braindecode
  params:
    F1: 8
    D: 2
    F2: 16
    kernel_length: 64
    depthwise_kernel_length: 16
    drop_prob: 0.25
training:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  max_epochs: 200
  patience: 25
  monitor: val_balanced_accuracy
  monitor_mode: max
  grad_clip: null
  mixed_precision: false
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 10
    min_lr: 1.0e-05
candidates:
- id: c0
  drop_prob: 0.25
  lr: 0.001
- id: c1
  drop_prob: 0.5
  lr: 0.001
augmentation:
  enabled: false
  gaussian_noise_std: 0.0
  time_shift_samples: 0
