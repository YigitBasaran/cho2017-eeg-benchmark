# Conda environment for the Cho2017 Motor Imagery Benchmark (Python 3.11 reference).
#
# Create with:   conda env create -f environment.yml
# Activate with: conda activate cho2017-benchmark
#
# Versions mirror the verified set in requirements.txt. The exact builds resolved
# on your machine are recorded next to every experiment via
# reproducibility.collect_environment(). ATCNet requires braindecode >= 1.1.
name: cho2017-benchmark
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.2.6
  - scipy=1.16.3
  - pandas=2.3.3
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - joblib=1.5.3
  - pyarrow=24.0.0
  - requests=2.32.5
  - jupyter=1.1.1
  - ipykernel=7.1.0
  - pytest=8.4.2
  # Installed via pip for the most current, mutually-compatible builds.
  - pip:
      - torch==2.6.0
      - mne==1.12.1
      - moabb==1.5.0
      - braindecode==1.5.2
