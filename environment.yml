# Conda environment for the Cho2017 Motor Imagery Benchmark.
#
# Create with:   conda env create -f environment.yml
# Activate with: conda activate cho2017-benchmark
#
# This pins Python 3.11, the reference interpreter for the project. The exact
# package builds resolved on your machine are recorded next to every experiment
# via reproducibility.collect_environment().
name: cho2017-benchmark
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.0.2
  - scipy=1.13.1
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - matplotlib=3.9.2
  - pyyaml=6.0.2
  - tqdm=4.66.5
  - joblib=1.4.2
  - pyarrow=17.0.0
  - requests=2.32.3
  - jupyter=1.1.1
  - ipykernel=6.29.5
  - pytest=8.3.3
  # Installed via pip for the most current, mutually-compatible builds.
  # ATCNet requires braindecode >= 1.1.
  - pip:
      - torch==2.4.1
      - mne==1.8.0
      - moabb==1.1.0
      - braindecode==1.5.1
